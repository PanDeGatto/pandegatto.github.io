<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pandegatto Portfolio</title>
</head>

<body>
  <section id="intro">
    <div id="intro-illustration-img"><img
        src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/intro_illustration.webp" /></div>
    <div id="intro-illustration-img-mobile"><img
        src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/intro_illustration_mobile.webp" />
    </div>
    <div id="intro-hand-container">
      <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/intro_hand_2.webp" />
    </div>
  </section>

  <div id="checkout">
    <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/gallery_2.png" />
  </div>
  <section id="navigation">
    <button data-filter="digital"><img
        src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/b_1.webp" /></button>
    <button data-filter="traditional"><img
        src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/b_2.webp" /></button>
    <button data-filter="photography"><img
        src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/b_3.webp" /></button>
  </section>

  <section id="gallery">
    <div class="gallery digital">
      <div class="row">
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/1.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/2.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/5.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/9.webp" />
        </div>
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/4.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/6.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/7.webp" />

        </div>
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/3.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/10.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/11.webp" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/12.webp" />
        </div>
      </div>
    </div>
    <div class="gallery traditional hidden">
      <div class="row">
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/t_1.jpg" />
        </div>
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/t_2.jpg" />
        </div>
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/t_3.jpg" />
        </div>
      </div>
    </div>
    <div class="gallery photography hidden">
      <div class="row">
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/p_6.jpg" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/p_1.jpg" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/p_2.jpg" />
        </div>
        <div class="column">
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/p_5.jpg" />
          <img src="https://cdn.jsdelivr.net/gh/pandegatto/pandegatto.github.io@gh-pages/p_4.jpg" />

        <div class="column">

        </div>
      </div>
    </div>
  </section>
  <div id="lightbox">
    <img id="lightbox-img" />
  </div>
  <script type="module" src="./app.js"></script>
</body>

</html>
